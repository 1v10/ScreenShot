name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependencies:
    uses: ./.github/workflows/dependencies.yml
  release:
    needs: dependencies
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate tag and release notes
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/check-release.ps1 -Tag $env:RELEASE_TAG
      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup override set 1.98.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      - name: Check, test, build and package
        run: ./scripts/build.ps1 -Headless
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ScreenTrans-${{ github.ref_name }}-windows-x64
          path: |
            dist/ScreenTrans-v*-win-x64.zip
            dist/ScreenTrans-v*-win-x64.exe
            dist/ScreenTrans-v*-win-x64.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_PREFIX: ${{ steps.meta.outputs.asset_prefix }}
          RELEASE_NOTES: ${{ steps.meta.outputs.notes }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          $assets = @('.zip', '.exe', '.sha256') | ForEach-Object { "dist/$env:ASSET_PREFIX$_" }
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--title', "ScreenTrans $env:RELEASE_TAG", '--notes-file', $env:RELEASE_NOTES)
          if ($env:IS_PRERELEASE -eq 'true') {
            $releaseArgs += @('--prerelease', '--latest=false')
          } else {
            $releaseArgs += '--latest'
          }
          & gh @releaseArgs @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; inspect existing releases before rerunning' }
