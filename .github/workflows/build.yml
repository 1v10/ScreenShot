name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    uses: ./.github/workflows/dependencies.yml
  windows:
    needs: dependencies
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup override set 1.98.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      - name: Check, test, build and package
        run: ./scripts/build.ps1 -Headless
      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: ScreenShot-windows-x64-${{ github.run_number }}
          path: |
            dist/ScreenShot-v*-win-x64.zip
            dist/ScreenShot-v*-win-x64.exe
            dist/ScreenShot-v*-win-x64.sha256
          if-no-files-found: error
          retention-days: 14
